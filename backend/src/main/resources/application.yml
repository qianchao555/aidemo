
server:
  port: 18989

spring:
  application:
    name: ai-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/aidemo
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com
      #chat:聊天，image:图像生成，embedding:文本向量化
      chat:
        options:
          model: qwen-plus
          temperature: 0.2 # 制度问答需低温度，避免幻觉
          #maxTokens: 2000  #默认不限制
          topP: 0.8
          topK: 50
      embedding:
        options:
          model: text-embedding-v2
          dimensions: 1536
    #向量库配置 (PostgreSQL + pgvector)
    vectorstore:
      pgvector:
        enabled: true
        schema-name: public
        table-name: xiaofuzi_knowledge_base_v2
        dimensions: 1536
        index-type: HNSW  #默认使用HNSW索引，适用于高维向量的近似最近邻搜索
        distance-type: COSINE_DISTANCE  #余弦距离
        initialize-schema: true #自动建表和索引（生产环境建议关闭，改为手动建表和索引）

      milvus:
        enabled: true
        host: localhost
        port: 19530
        username: root
        password: ${MILVUS_PASSWORD:milvus}
        database-name: default
        collection-name: xiaofuzi_knowledge_base
        embedding-dimension: 1536
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

skills:
  file-system:
    path: ./external-skills

#自定义配置
app:
  init:
    default-admin: zhangsan
    default-password: "123456"
    default-department: 全公司
    default-role: user
  agent:
    sse:
      timeout-ms: 180000  # SSE 连接超时（毫秒）
      token-delay-ms: 30  # SSE 逐句发送间隔（毫秒）
  rag:
    embedding-batch-size: 25  # 向量入库批次大小
    rrf-k: 60.0  # RRF 融合排序 k 值
    quality:
      rrf-threshold: 0.01  # 有效召回 RRF 分数下限
      llm-threshold: 3  # 有效召回 LLM 评分下限
    rerank-top-n: 3  # LLM 重排序保留数量
    chunk-truncate-length: 500  # LLM 重排序时 chunk 截断长度
  faq:
    cluster-threshold: 0.85  # 语义聚类相似度阈值
    coverage-threshold: 0.85  # 已覆盖过滤阈值
    similarity-threshold: 0.7  # 相似检测阈值
    semantic-match-threshold: 0.70  # 语义匹配阈值（第四级兜底，低于聚类/覆盖的0.85，高于相似检测的0.7）
    embedding-batch-size: 50  # FAQ embedding 批次大小
  workspace:
    path: ./workspace  # 文件系统工具工作目录

ai:
  chat:
    enabled: true  # 启用手动配置的ChatModel
    provider: dashscope  # 可选值: 默认dashscope, volcano-engine, openai
    api-key: ${AI_DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com
    model: qwen-plus
    dashscope:
      base-url: https://dashscope.aliyuncs.com
    volcano-engine:
      base-url: https://ark.cn-beijing.volces.com/api/v3
      model: doubao-pro-32k
    openai:
      base-url: https://api.openai.com/v1
      model: gpt-4



mybatis:
  mapper-locations: classpath:mapper/*.xml

logging:
  config: classpath:logback-spring.xml
